<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: black; 
            overflow: hidden; 
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        /* Kaca Transparan Penutup Video */
        .kaca-jebakan {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 999; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Link jebakan ke Adsterra saat area video diklik -->
    <a href="URL_SMARTLINK_ADSTERRA_ANDA" target="_blank">
        <div class="https://dependedunmoved.com/dna4yka9e?key=de468ff7f772dec31e928ad5dcf9c493"></div>
    </a>
    
    <!-- Video pendek Anda (usahakan format .mp4 dan berukuran kecil) -->
    <video autoplay loop muted playsinline>
        <source src="https://file-examples.com/storage/fe9009943b6a6964b9f07d0/2017/04/file_example_MP4_640_3MG.mp4" type="video/mp4">
    </video>
</body>
</html>
